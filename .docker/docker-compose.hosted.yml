# Coolify fixe le répertoire de projet Compose à la racine du dépôt.
# Pour un lancement manuel, passez --project-directory . depuis cette racine.
x-database-url: &database-url "${DATABASE_URL:-}"
x-app-port: &app-port "${HOSTED_APP_PORT:-80}"

services:
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: builder
    environment:
      DATABASE_URL: *database-url
    command: ["sh", "scripts/hosted-db-migrate.sh"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runner
      args:
        APP_PORT: *app-port
    restart: unless-stopped
    command: ["sh", "scripts/hosted-start.sh"]
    expose:
      - *app-port
    environment:
      NODE_ENV: production
      PORT: *app-port
      DATABASE_URL: *database-url
      SESSION_SECRET: "${SESSION_SECRET:-}"
      WEBSOCKET_SECRET: "${WEBSOCKET_SECRET:-}"
      QR_ENCRYPTION_KEY: "${QR_ENCRYPTION_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_VERBOSE: "${LOG_VERBOSE:-false}"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-Zomb'in The Dark}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/setup/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  uploads:
