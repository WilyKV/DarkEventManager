# =============================================================================
# darkevent.wilykv.fr.conf — vhost nginx pour DarkEventManager
#
# DÉPLOIEMENT :
#   Ce fichier doit être COPIÉ sur le Jetson dans ~/JetsonProxy/conf.d/
#   AVANT de recharger nginx_proxy.
#
# PRÉ-REQUIS OBLIGATOIRE : le certificat SSL doit exister au préalable.
#   Générer le cert (stoppe nginx ~30s — faire hors heure de pointe) :
#     cd ~/JetsonProxy && make ssl-init DOMAIN=darkevent.wilykv.fr EMAIL=wilykv@gmail.com
#
# ORDRE DE DÉPLOIEMENT :
#   1. DNS A darkevent.wilykv.fr → IP publique du Jetson
#   2. make ssl-init DOMAIN=darkevent.wilykv.fr EMAIL=wilykv@gmail.com
#   3. cp ce fichier ~/JetsonProxy/conf.d/darkevent.wilykv.fr.conf
#   4. cd ~/JetsonProxy && make reload
#   Le conteneur darkevent_app doit être démarré et sur le réseau "proxy"
#   (assuré par docker-compose.prod.yml avec networks: [default, proxy]).
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — ACME challenge (certbot) + redirection HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name darkevent.wilykv.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — terminaison TLS + reverse proxy vers darkevent_app:5000
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name darkevent.wilykv.fr;

    # --- Certificats Let's Encrypt ---
    ssl_certificate     /etc/letsencrypt/live/darkevent.wilykv.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkevent.wilykv.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- En-têtes de sécurité ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;

    # --- Taille max des corps (uploads PDF/badges) ---
    client_max_body_size 50M;

    # --- Résolution DNS Docker interne ---
    resolver 127.0.0.11 valid=30s;
    set $upstream http://darkevent_app:5000;

    # --- WebSocket /ws — sync offline/online ---
    location /ws {
        proxy_pass              $upstream;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "Upgrade";
        proxy_set_header        Host       $host;
        proxy_set_header        X-Real-IP  $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
    }

    # --- Application principale ---
    location / {
        proxy_pass              $upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      120s;
        proxy_send_timeout      120s;
        proxy_connect_timeout   10s;
        proxy_buffering         off;
    }
}
